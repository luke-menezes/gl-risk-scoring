name: tests

on:
  push:
    branches: [main]   # other branches are tested through their pull request, once
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,ml]"
      - run: ruff check .
      - run: pytest -q
      - name: Run the demo notebook
        if: matrix.python-version == '3.14'
        working-directory: notebooks   # the notebook reads the fixtures by a relative path
        run: jupyter nbconvert --to notebook --execute --output /tmp/out.ipynb demo.ipynb
